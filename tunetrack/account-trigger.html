<!-- Account Trigger -->
<button
    type="button"
    class="swiss-icon-btn"
    id="swissAccountBtn"
    aria-label="Open account login"
>
    <svg
        class="swiss-account-icon"
        id="swissAccountIcon"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"></path>
    </svg>

    <span
        class="swiss-account-label"
        id="swissAccountLabel"
        hidden
    ></span>
</button>
